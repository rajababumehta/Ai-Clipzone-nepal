<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background solid black -->
    <rect id="bg" width="512" height="512" fill="#000000" rx="96" />

    <!-- Silver Chrome Gradients -->
    <linearGradient id="pwaSilverChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="pwaSilverDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="pwaArcGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <filter id="pwaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Pure Black Rounded Base -->
  <rect width="512" height="512" fill="#000000" rx="96" />
  <rect width="504" height="504" x="4" y="4" fill="none" stroke="#334155" stroke-width="2" rx="92" opacity="0.6" />

  <!-- CELESTIAL METALLIC ARC SWEEP -->
  <path 
    d="M 50 360 C 20 200, 140 90, 270 90 C 370 90, 435 150, 465 230" 
    fill="none" 
    stroke="url(#pwaArcGlow)" 
    stroke-width="12" 
    stroke-linecap="round"
    filter="url(#pwaGlow)"
  />
  <path 
    d="M 50 360 C 20 200, 140 90, 270 90 C 370 90, 435 150, 465 230" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="5" 
    stroke-linecap="round"
  />

  <!-- Sparkles -->
  <circle cx="280" cy="88" r="3" fill="#ffffff" filter="url(#pwaGlow)" />
  <circle cx="360" cy="115" r="3.5" fill="#ffffff" filter="url(#pwaGlow)" />
  <circle cx="420" cy="170" r="4" fill="#ffffff" filter="url(#pwaGlow)" />
  <circle cx="455" cy="210" r="2.5" fill="#ffffff" />

  <!-- 3D GRADUATION CAP (Mortarboard) -->
  <g transform="translate(142, 235) scale(0.7)">
    <polygon points="0,-16 63,-39 0,-62 -63,-39" fill="url(#pwaSilverChrome)" stroke="#ffffff" stroke-width="2" />
    <path d="M -24 -10 Q 0 6 24 -10 L 22 4 Q 0 18 -22 4 Z" fill="url(#pwaSilverDepth)" />
    <ellipse cx="0" cy="-39" rx="5" ry="3" fill="#ffffff" />
    <path d="M 0 -39 Q 28 -35 40 -15 Q 43 0 41 12" fill="none" stroke="url(#pwaSilverChrome)" stroke-width="3" stroke-linecap="round" />
    <polygon points="41,12 44,24 38,24" fill="#ffffff" />
  </g>

  <!-- 3D METALLIC SILVER CHROME TEXT -->
  <!-- "Ai" -->
  <text 
    x="65" 
    y="360" 
    font-family="'Impact', 'Arial Black', -apple-system, sans-serif" 
    font-weight="900" 
    font-size="120" 
    letter-spacing="1" 
    fill="url(#pwaSilverChrome)"
    stroke="#ffffff"
    stroke-width="1.5"
  >
    Ai
  </text>

  <!-- "CLIPZONE" -->
  <text 
    x="185" 
    y="360" 
    font-family="'Impact', 'Arial Black', -apple-system, sans-serif" 
    font-weight="900" 
    font-size="68" 
    letter-spacing="2" 
    fill="url(#pwaSilverChrome)"
    stroke="#ffffff"
    stroke-width="1"
  >
    CLIPZONE
  </text>
  
  <text 
    x="256" 
    y="420" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="800" 
    font-size="20" 
    letter-spacing="8" 
    fill="#94a3b8" 
    text-anchor="middle"
  >
    NEPAL
  </text>
</svg>
